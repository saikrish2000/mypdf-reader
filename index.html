  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('pdf-reader-theme');
          if (!theme) {
            theme = 'dark';
          }
          if (theme === 'sepia') theme = 'light';
          var cls = { light: null, dark: 'dark', contrast: 'contrast' }[theme];
          if (cls) document.documentElement.classList.add(cls);
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
