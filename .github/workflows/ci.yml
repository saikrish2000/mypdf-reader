name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

  security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Dependency audit (fail on high/critical)
        run: |
          set -o pipefail
          npm audit --audit-level=high --json > audit.json || true
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('audit.json', 'utf8');
            let a;
            try { a = JSON.parse(raw); } catch { console.error('FAIL: could not parse audit.json'); process.exit(1); }
            const meta = a.metadata?.vulnerabilities ?? {};
            const bad = (meta.high ?? 0) + (meta.critical ?? 0);
            console.log('Audit summary:', JSON.stringify(meta));
            if (bad > 0) { console.error('FAIL: ' + bad + ' high/critical advisories'); process.exit(1); }
          "

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --no-banner --redact --exit-code 1

      - name: Lovable scan-results gate
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'security-gate-bypass') }}
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          LOVABLE_PROJECT_ID: ${{ secrets.LOVABLE_PROJECT_ID }}
        run: node scripts/security-gate.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            audit.json
            security-findings.json
          if-no-files-found: ignore
